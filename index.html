<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6048d7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mijn Training"><link rel="manifest" href="manifest.webmanifest"><title>Mijn Training</title><style>
:root{--p:#6048d7;--p2:#8b5cf6;--bg:#f6f5fb;--card:#fff;--ink:#18152a;--muted:#77738b;--ok:#16a66d;--line:#e8e5f0;--red:#d34e5c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--ink);padding-bottom:82px}header{background:linear-gradient(135deg,var(--p),var(--p2));color:white;padding:calc(22px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:27px}header p{margin:6px 0 0;opacity:.85}.wrap{max-width:650px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 4px 18px #352c5e0c}h2{font-size:19px;margin:0 0 13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;padding:13px 5px}.stat b{display:block;font-size:22px;color:var(--p)}button,input,select{font:inherit}button{cursor:pointer}.primary,.green{width:100%;border:0;border-radius:13px;padding:13px;font-weight:700;color:white;background:var(--p)}.green{background:var(--ok)}.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}.danger{color:var(--red)}input,select{width:100%;border:1px solid #d8d4e3;border-radius:11px;padding:11px;background:white}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.grow{flex:1}.item small,.hint{color:var(--muted);font-size:13px}.check{width:27px;height:27px;border-radius:8px;border:2px solid #c9c5d5;background:white}.check.done{background:var(--ok);border-color:var(--ok);color:white}.pill{background:#eeeafd;color:var(--p);border-radius:999px;padding:5px 9px;font-size:12px}.hidden{display:none!important}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav{border:0;background:white;color:var(--muted);font-size:11px;padding:5px}.nav span{display:block;font-size:21px}.nav.active{color:var(--p);font-weight:700}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{text-align:center;padding:8px 2px;border-radius:8px;background:#f2f0f7;font-size:13px}.day.done{background:#c9f4e2;color:#087750;font-weight:800}.day.blank{background:transparent}.heads{color:var(--muted);font-size:11px;background:transparent}.program-select{margin-bottom:12px}.row{display:flex;gap:8px}.row>*{flex:1}.empty{text-align:center;color:var(--muted);padding:18px 4px}
</style></head><body><header><div style="max-width:650px;margin:auto"><h1>💪 Mijn Training</h1><p id="hello">Klaar voor je volgende training?</p></div></header><main class="wrap">
<section id="today"><div class="stats" id="todayStats"></div><div class="card" style="margin-top:14px"><h2>Vandaag</h2><select id="todayProgram" class="program-select" onchange="loadToday()"></select><div id="todayExercises"></div><button class="green" id="finishBtn" onclick="finishTraining()">✓ Training voltooid</button></div></section>
<section id="programs" class="hidden"><div class="card"><h2>📋 Nieuw programma</h2><div class="field"><label>Naam</label><input id="progName" placeholder="bv. Full body"></div><button class="primary" onclick="addProgram()">Programma toevoegen</button></div><div id="programList"></div></section>
<section id="exercises" class="hidden"><div class="card"><h2>🏋️ Oefening toevoegen</h2><div class="field"><label>Naam</label><input id="exName" placeholder="bv. Squat"></div><div class="row"><div class="field"><label>Sets</label><input id="exSets" type="number" min="1" value="3"></div><div class="field"><label>Herhalingen / tijd</label><input id="exReps" placeholder="bv. 12 of 30 sec"></div></div><div class="field"><label>Categorie</label><select id="exCat"><option>Full body</option><option>Benen</option><option>Core</option><option>Rug</option><option>Armen</option><option>Mobiliteit</option></select></div><button class="primary" onclick="addExercise()">Oefening toevoegen</button></div><div class="card"><h2>Mijn oefeningen</h2><div id="exerciseList"></div></div></section>
<section id="progress" class="hidden"><div class="stats" id="progressStats"></div><div class="card" style="margin-top:14px"><div class="row"><h2 style="flex:2">📊 Kalender</h2><button class="ghost" onclick="month(-1)">‹</button><button class="ghost" onclick="month(1)">›</button></div><p id="monthLabel" class="hint"></p><div id="calendar" class="calendar"></div></div><div class="card"><h2>Recente trainingen</h2><div id="history"></div></div></section>
</main><nav class="bottom"><button class="nav active" onclick="go('today',this)"><span>🏠</span>Vandaag</button><button class="nav" onclick="go('programs',this)"><span>📋</span>Programma's</button><button class="nav" onclick="go('exercises',this)"><span>🏋️</span>Oefeningen</button><button class="nav" onclick="go('progress',this)"><span>📊</span>Voortgang</button></nav>
<script>
const KEY='mijnTrainingPWA2';let D=JSON.parse(localStorage.getItem(KEY)||'null')||{exercises:[{id:1,name:'Squat',sets:3,reps:'10',cat:'Benen'},{id:2,name:'Bird dog',sets:3,reps:'8 per kant',cat:'Core'},{id:3,name:'Wall push-up',sets:3,reps:'10',cat:'Armen'}],programs:[{id:1,name:'Starttraining',exerciseIds:[1,2,3]}],history:{},weekGoal:3};let checked={};let logs={};let view=new Date();
const $=id=>document.getElementById(id),save=()=>{localStorage.setItem(KEY,JSON.stringify(D));render()};function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function daykey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function go(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function weekCount(){let n=0,d=new Date(),w=(d.getDay()+6)%7,start=new Date(d);start.setDate(d.getDate()-w);for(let i=0;i<7;i++){let x=new Date(start);x.setDate(start.getDate()+i);if(D.history[daykey(x)])n++}return n}function streak(){let n=0,d=new Date();while(D.history[daykey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function render(){let t=Object.keys(D.history).length,w=weekCount();$('todayStats').innerHTML=`<div class="card stat"><small>Deze week</small><b>${w}/${D.weekGoal}</b></div><div class="card stat"><small>Reeks</small><b>${streak()}</b></div><div class="card stat"><small>Totaal</small><b>${t}</b></div>`;$('todayProgram').innerHTML=D.programs.length?D.programs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''):'<option>Maak eerst een programma</option>';renderExercises();renderPrograms();loadToday();renderProgress()}
function renderExercises(){$('exerciseList').innerHTML=D.exercises.length?D.exercises.map(e=>`<div class="item"><div class="grow"><b>${esc(e.name)}</b><br><small>${e.sets} sets × ${esc(e.reps)} · ${esc(e.cat)}</small></div><button class="ghost danger" onclick="removeExercise(${e.id})">×</button></div>`).join(''):'<div class="empty">Nog geen oefeningen.</div>'}
function addExercise(){let n=$('exName').value.trim(),r=$('exReps').value.trim();if(!n||!r)return;D.exercises.push({id:Date.now(),name:n,sets:+$('exSets').value||1,reps:r,cat:$('exCat').value});$('exName').value='';$('exReps').value='';save()}function removeExercise(id){D.exercises=D.exercises.filter(e=>e.id!==id);D.programs.forEach(p=>p.exerciseIds=p.exerciseIds.filter(x=>x!==id));save()}
function addProgram(){let n=$('progName').value.trim();if(!n)return;D.programs.push({id:Date.now(),name:n,exerciseIds:[]});$('progName').value='';save()}function deleteProgram(id){D.programs=D.programs.filter(p=>p.id!==id);save()}function toggleInProgram(pid,eid){let p=D.programs.find(x=>x.id===pid),i=p.exerciseIds.indexOf(eid);i<0?p.exerciseIds.push(eid):p.exerciseIds.splice(i,1);save()}
function renderPrograms(){$('programList').innerHTML=D.programs.map(p=>`<div class="card"><div class="item"><div class="grow"><h2 style="margin:0">${esc(p.name)}</h2><small>${p.exerciseIds.length} oefeningen</small></div><button class="ghost danger" onclick="deleteProgram(${p.id})">Verwijder</button></div>${D.exercises.map(e=>`<div class="item"><button class="check ${p.exerciseIds.includes(e.id)?'done':''}" onclick="toggleInProgram(${p.id},${e.id})">${p.exerciseIds.includes(e.id)?'✓':''}</button><div class="grow">${esc(e.name)}<br><small>${e.sets} × ${esc(e.reps)}</small></div><span class="pill">${esc(e.cat)}</span></div>`).join('')||'<div class="empty">Voeg eerst oefeningen toe.</div>'}</div>`).join('')||'<div class="card empty">Nog geen programma.</div>'}
function loadToday(){let pid=+$('todayProgram').value,p=D.programs.find(x=>x.id===pid);checked={};logs={};if(!p){$('todayExercises').innerHTML='<div class="empty">Maak eerst een programma.</div>';$('finishBtn').classList.add('hidden');return}$('finishBtn').classList.remove('hidden');let es=p.exerciseIds.map(id=>D.exercises.find(e=>e.id===id)).filter(Boolean);$('todayExercises').innerHTML=es.length?es.map(e=>`<div class="item" style="align-items:flex-start"><button id="c${e.id}" class="check" onclick="toggleCheck(${e.id})"></button><div class="grow"><b>${esc(e.name)}</b><br><small>Doel: ${e.sets} × ${esc(e.reps)}</small><div class="row" style="margin-top:8px"><div class="field" style="margin:0"><label>Herhalingen gedaan</label><input type="number" min="0" inputmode="numeric" placeholder="bv. 12" onchange="setLog(${e.id},'reps',this.value)"></div><div class="field" style="margin:0"><label>Gewicht (kg)</label><input type="number" min="0" step="0.5" inputmode="decimal" placeholder="bv. 8" onchange="setLog(${e.id},'weight',this.value)"></div></div></div></div>`).join(''):'<div class="empty">Dit programma bevat nog geen oefeningen.</div>'}function setLog(id,key,val){logs[id]=logs[id]||{};logs[id][key]=val===''?null:Number(val)}function toggleCheck(id){checked[id]=!checked[id];let b=$('c'+id);b.classList.toggle('done',checked[id]);b.textContent=checked[id]?'✓':''}function finishTraining(){let pid=+$('todayProgram').value,p=D.programs.find(x=>x.id===pid);if(!p)return;D.history[daykey()]={program:p.name,completed:p.exerciseIds.filter(id=>checked[id]).length,total:p.exerciseIds.length,details:p.exerciseIds.map(id=>{let e=D.exercises.find(x=>x.id===id),l=logs[id]||{};return e?{name:e.name,done:!!checked[id],reps:l.reps??null,weight:l.weight??null}:null}).filter(Boolean)};save();alert('Training opgeslagen! 💪')}
function month(n){view.setMonth(view.getMonth()+n);renderProgress()}function renderProgress(){let t=Object.keys(D.history).length,w=weekCount();$('progressStats').innerHTML=`<div class="card stat"><small>Weekdoel</small><b>${w}/${D.weekGoal}</b></div><div class="card stat"><small>Reeks</small><b>${streak()}</b></div><div class="card stat"><small>Totaal</small><b>${t}</b></div>`;let y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();$('monthLabel').textContent=first.toLocaleDateString('nl-BE',{month:'long',year:'numeric'});let h=['ma','di','wo','do','vr','za','zo'].map(x=>`<div class="day heads">${x}</div>`).join(''),pad=(first.getDay()+6)%7;h+='<div class="day blank"></div>'.repeat(pad);for(let d=1;d<=days;d++){let x=new Date(y,m,d),done=D.history[daykey(x)];h+=`<div class="day ${done?'done':''}">${d}${done?' ✓':''}</div>`}$('calendar').innerHTML=h;let ks=Object.keys(D.history).sort().reverse();$('history').innerHTML=ks.length?ks.map(k=>{let x=D.history[k];return `<div class="item"><div class="grow"><b>${new Date(k+'T12:00').toLocaleDateString('nl-BE',{day:'numeric',month:'short',year:'numeric'})}</b><br><small>${esc(x.program)} · ${x.completed}/${x.total} afgevinkt${x.details&&x.details.some(d=>d.reps!=null||d.weight!=null)?'<br>'+x.details.filter(d=>d.reps!=null||d.weight!=null).map(d=>esc(d.name)+': '+(d.reps!=null?d.reps+' reps':'')+(d.reps!=null&&d.weight!=null?' · ':'')+(d.weight!=null?d.weight+' kg':'')).join('<br>'):''}</small></div><span>✓</span></div>`}).join(''):'<div class="empty">Nog geen trainingen geregistreerd.</div>'}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
